# Duman testi WAF yapılandırması. @...@ alanlarını duman-testi.sh doldurur.
# Üretim yapılandırması değildir: üretimde gerçek sertifika, güncel CRS ve LMS istisnaları gerekir.
load_module @MODUL@;
user root;
worker_processes 4;
worker_rlimit_nofile 100000;
pid @CALISMA@/waf.pid;

events {
	worker_connections 20000;
}

http {
	access_log off;
	client_body_temp_path @CALISMA@/gecici/waf-govde;
	proxy_temp_path @CALISMA@/gecici/waf-proxy;
	fastcgi_temp_path @CALISMA@/gecici/waf-f;
	uwsgi_temp_path @CALISMA@/gecici/waf-u;
	scgi_temp_path @CALISMA@/gecici/waf-s;

	upstream uygulama {
		server 10.99.2.2:8080;
		keepalive 256;
	}

	server {
		listen 443 ssl reuseport;
		server_name lms.atlas.example;

		ssl_certificate @CALISMA@/sertifika.pem;
		ssl_certificate_key @CALISMA@/anahtar.pem;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_session_cache shared:TLS:20m;

		modsecurity @MOTOR@;
		modsecurity_rules_file @CALISMA@/modsec.conf;

		location / {
			proxy_pass http://uygulama;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
		}
	}
}
